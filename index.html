<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090b10" />
  <meta name="creativeos-build" content="unified-v3-intelligence" />
  <title>CreativeOS — AI Creative Operating System</title>
  <style>

:root{
  --bg:#07090d;
  --bg2:#0b0e14;
  --panel:#10141d;
  --panel2:#141925;
  --panel3:#191f2c;
  --line:#232a39;
  --line2:#2e3850;
  --text:#f4f7fb;
  --muted:#8f99ad;
  --muted2:#657087;
  --blue:#4f7cff;
  --blue2:#6aa0ff;
  --violet:#8d62ff;
  --green:#35d07f;
  --yellow:#f2bb4b;
  --red:#ff6476;
  --cyan:#46d4ff;
  --shadow: 0 18px 50px rgba(0,0,0,.36);
  --radius:18px;
  --radius-sm:12px;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
  radial-gradient(1000px 700px at 70% -20%, rgba(79,124,255,.15), transparent 58%),
  radial-gradient(800px 600px at 10% 0%, rgba(141,98,255,.11), transparent 50%),
  var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{color:inherit}
a{color:inherit}
.app-shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}
.sidebar{
  position:sticky;top:0;height:100vh;border-right:1px solid var(--line);
  background:linear-gradient(180deg,rgba(13,16,23,.96),rgba(7,9,13,.98));
  padding:22px 16px;display:flex;flex-direction:column;z-index:20
}
.brand{display:flex;align-items:center;gap:12px;padding:5px 8px 24px}
.brand-mark{
  width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--blue),var(--violet));box-shadow:0 0 32px rgba(79,124,255,.28);
  position:relative;overflow:hidden
}
.brand-mark:before,.brand-mark:after{content:"";position:absolute;background:#fff;border-radius:9px}
.brand-mark:before{width:17px;height:6px;transform:rotate(45deg)}
.brand-mark:after{width:17px;height:6px;transform:rotate(-45deg)}
.brand-title{font-weight:800;letter-spacing:-.03em;font-size:18px}
.brand-sub{font-size:10px;color:var(--muted);margin-top:1px}
.nav-group-title{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted2);padding:12px 11px 8px}
.nav{display:grid;gap:4px}
.nav-btn{
  width:100%;border:0;background:transparent;text-align:left;display:flex;align-items:center;gap:11px;
  padding:10px 11px;border-radius:11px;color:#aab3c3;cursor:pointer;transition:.15s ease
}
.nav-btn:hover{background:#121722;color:#fff}
.nav-btn.active{background:linear-gradient(90deg,rgba(79,124,255,.18),rgba(141,98,255,.10));color:#fff;border:1px solid rgba(100,137,255,.2)}
.nav-ico{width:20px;height:20px;display:grid;place-items:center;color:#8490a6}
.nav-btn.active .nav-ico{color:#83a2ff}
.sidebar-footer{margin-top:auto;display:grid;gap:10px}
.connection-card{border:1px solid var(--line);background:#0d1119;border-radius:14px;padding:12px}
.connection-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dot{width:8px;height:8px;border-radius:99px;background:var(--yellow);box-shadow:0 0 0 4px rgba(242,187,75,.08)}
.dot.green{background:var(--green);box-shadow:0 0 0 4px rgba(53,208,127,.08)}
.dot.red{background:var(--red)}
.connection-label{display:flex;align-items:center;gap:9px;font-size:12px;color:#c4cada}
.connection-note{font-size:10px;color:var(--muted2);margin-top:7px;line-height:1.35}
.main{min-width:0}
.topbar{
  height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;position:sticky;top:0;background:rgba(7,9,13,.83);backdrop-filter:blur(18px);z-index:15
}
.top-left{display:flex;align-items:center;gap:12px;min-width:0}
.breadcrumb{color:var(--muted);font-size:12px;white-space:nowrap}
.page-title{font-size:17px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-actions{display:flex;gap:9px;align-items:center}
.btn{
  border:1px solid var(--line2);background:#111620;border-radius:11px;padding:9px 13px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:650;font-size:12px;transition:.15s ease
}
.btn:hover{transform:translateY(-1px);border-color:#3c4865;background:#151b28}
.btn.primary{border-color:transparent;background:linear-gradient(135deg,var(--blue),#7359ff);box-shadow:0 10px 28px rgba(79,124,255,.19)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.green{border-color:rgba(53,208,127,.25);background:rgba(53,208,127,.12);color:#a6f1c8}
.btn.danger{border-color:rgba(255,100,118,.24);background:rgba(255,100,118,.09);color:#ffadb7}
.btn.ghost{background:transparent}
.btn.small{padding:7px 10px;border-radius:9px;font-size:11px}
.btn.icon{width:38px;height:38px;padding:0}
.content{padding:28px;max-width:1600px;margin:0 auto}
.hero{
  display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:24px
}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#7e8aa0;margin-bottom:9px}
.hero h1{font-size:34px;letter-spacing:-.05em;margin:0 0 8px;line-height:1.03}
.hero p{margin:0;color:var(--muted);font-size:13px;max-width:700px;line-height:1.55}
.hero-stats{display:flex;gap:9px;flex-wrap:wrap}
.stat-chip{border:1px solid var(--line);background:#0d1119;border-radius:12px;padding:9px 11px;min-width:108px}
.stat-chip b{display:block;font-size:16px}
.stat-chip span{font-size:10px;color:var(--muted)}
.grid{display:grid;gap:16px}
.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{
  border:1px solid var(--line);background:linear-gradient(180deg,rgba(17,21,30,.95),rgba(13,16,23,.96));
  border-radius:var(--radius);box-shadow:0 8px 28px rgba(0,0,0,.18)
}
.card.pad{padding:18px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}
.section-title h2{font-size:14px;margin:0;letter-spacing:-.015em}
.section-title p{font-size:11px;color:var(--muted);margin:3px 0 0}
.product-card{overflow:hidden;position:relative;min-height:310px;cursor:pointer;transition:.18s ease}
.product-card:hover{transform:translateY(-3px);border-color:#35425f;box-shadow:var(--shadow)}
.product-visual{
  height:112px;position:relative;display:flex;align-items:center;padding:18px;overflow:hidden;border-bottom:1px solid var(--line)
}
.product-visual:after{
  content:"";position:absolute;inset:auto -40px -80px auto;width:180px;height:180px;border-radius:99px;
  background:radial-gradient(circle,rgba(255,255,255,.14),transparent 67%)
}
.visual-paw{background:
  radial-gradient(circle at 80% 25%,rgba(79,124,255,.35),transparent 36%),
  linear-gradient(135deg,#101931,#0e1420 58%,#141525)}
.visual-baby{background:
  radial-gradient(circle at 75% 30%,rgba(255,186,112,.22),transparent 36%),
  linear-gradient(135deg,#242018,#171612 58%,#1d1718)}
.visual-run{background:
  radial-gradient(circle at 80% 22%,rgba(53,208,127,.22),transparent 36%),
  linear-gradient(135deg,#10251d,#101818 58%,#111b1b)}
.product-monogram{font-size:46px;font-weight:900;letter-spacing:-.08em;color:rgba(255,255,255,.88);position:relative;z-index:1}
.product-status{position:absolute;right:14px;top:14px;z-index:2}
.badge{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:rgba(9,12,18,.74);
  border-radius:999px;padding:5px 8px;font-size:9px;font-weight:750;letter-spacing:.02em
}
.badge.green{color:#94f0bb;border-color:rgba(53,208,127,.3);background:rgba(28,76,53,.35)}
.badge.yellow{color:#f5ce7d;border-color:rgba(242,187,75,.26);background:rgba(86,60,12,.28)}
.badge.red{color:#ffa2ae;border-color:rgba(255,100,118,.26);background:rgba(92,24,35,.28)}
.badge.blue{color:#a9c0ff;border-color:rgba(79,124,255,.3);background:rgba(40,58,111,.28)}
.product-body{padding:16px}
.product-name-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.product-name{font-size:16px;font-weight:800;letter-spacing:-.025em}
.product-sub{font-size:10px;color:var(--muted);margin-top:3px}
.day-ring{
  min-width:44px;height:44px;border-radius:99px;border:3px solid rgba(79,124,255,.3);display:grid;place-items:center;
  font-size:10px;line-height:1.1;text-align:center;color:#b9c8ff;background:#0b101b
}
.day-ring b{display:block;font-size:13px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}
.metric{padding:9px;background:#0b0f16;border:1px solid #1c2331;border-radius:11px;min-width:0}
.metric b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric span{font-size:9px;color:var(--muted2)}
.coverage{margin-top:13px}
.cover-row{display:grid;grid-template-columns:72px 1fr 24px;align-items:center;gap:8px;margin-top:7px}
.cover-row span{font-size:9px;color:var(--muted)}
.track{height:5px;background:#202635;border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--violet))}
.cover-row b{font-size:9px;text-align:right;color:#a8b2c5}
.product-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.signal{font-size:10px;color:var(--muted);display:flex;gap:6px;align-items:center}
.mini-dot{width:6px;height:6px;border-radius:50%;background:var(--yellow)}
.mini-dot.green{background:var(--green)}
.mini-dot.red{background:var(--red)}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 17px;border-bottom:1px solid var(--line)}
.panel-head h3{font-size:13px;margin:0}
.panel-head p{font-size:10px;margin:3px 0 0;color:var(--muted)}
.attention-list{display:grid}
.attention-item{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #1d2330}
.attention-item:last-child{border-bottom:0}
.thumb{
  width:54px;height:54px;border-radius:12px;border:1px solid #293248;background:
  linear-gradient(145deg,#263249,#11151f 65%);position:relative;overflow:hidden;flex:0 0 auto
}
.thumb:before{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.12);left:14px;top:9px}
.thumb:after{content:"";position:absolute;width:34px;height:18px;border-radius:16px 16px 6px 6px;background:rgba(255,255,255,.1);left:9px;bottom:7px}
.attention-copy{min-width:0;flex:1}
.attention-copy b{display:block;font-size:12px}
.attention-copy span{display:block;font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.context-bar{
  border:1px solid rgba(79,124,255,.25);background:
  linear-gradient(90deg,rgba(79,124,255,.08),rgba(141,98,255,.06)),#0c111a;
  border-radius:16px;padding:14px 15px;display:flex;align-items:center;gap:12px;flex-wrap:wrap
}
.context-title{font-size:11px;font-weight:800;margin-right:4px;display:flex;align-items:center;gap:8px}
.context-pill{
  border:1px solid #2b3650;background:#111827;border-radius:999px;padding:7px 9px;font-size:10px;color:#cbd5ea;
  display:flex;gap:7px;align-items:center
}
.context-pill .x{color:#758198;cursor:pointer;font-weight:900}
.context-empty{font-size:10px;color:var(--muted)}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:15px}
.search{
  border:1px solid var(--line2);background:#0d1119;color:#e9eef8;border-radius:11px;padding:10px 12px;min-width:240px;outline:none
}
.search:focus{border-color:#516baf;box-shadow:0 0 0 3px rgba(79,124,255,.09)}
.select{
  border:1px solid var(--line2);background:#0d1119;color:#dfe6f4;border-radius:11px;padding:10px 12px;outline:none
}
.concept-card{padding:0;overflow:hidden;transition:.16s ease}
.concept-card:hover{border-color:#35425e;transform:translateY(-2px)}
.concept-preview{
  height:160px;background:
  linear-gradient(120deg,rgba(79,124,255,.16),rgba(141,98,255,.08)),
  linear-gradient(145deg,#1c2434,#0e121a);position:relative;overflow:hidden
}
.concept-preview .scene{position:absolute;inset:0;display:flex;align-items:flex-end;padding:16px}
.scene-figure{width:42px;height:88px;background:linear-gradient(180deg,#53617d,#253047);border-radius:20px 20px 12px 12px;opacity:.65}
.scene-figure.small{height:68px;margin-left:20px;opacity:.4}
.scene-card{margin-left:auto;width:90px;height:62px;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(255,255,255,.06)}
.concept-body{padding:15px}
.concept-top{display:flex;justify-content:space-between;gap:10px}
.concept-name{font-size:14px;font-weight:800;letter-spacing:-.02em}
.concept-desc{font-size:10px;color:var(--muted);line-height:1.45;margin:8px 0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:9px;border:1px solid #2a3244;background:#0d1118;color:#9ba7bc;border-radius:999px;padding:5px 7px}
.chip.blue{border-color:rgba(79,124,255,.28);color:#aebfff;background:rgba(79,124,255,.08)}
.chip.green{border-color:rgba(53,208,127,.25);color:#94eebb;background:rgba(53,208,127,.07)}
.concept-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0}
.concept-stat{background:#0c1017;border:1px solid #1e2635;border-radius:10px;padding:8px}
.concept-stat b{font-size:11px;display:block}
.concept-stat span{font-size:8px;color:var(--muted2)}
.card-actions{display:flex;gap:7px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);padding:0 3px;margin-bottom:18px;overflow:auto}
.tab{
  border:0;background:transparent;color:#8f99ac;padding:12px 12px 11px;border-bottom:2px solid transparent;cursor:pointer;font-size:11px;font-weight:700;white-space:nowrap
}
.tab.active{color:#fff;border-color:var(--blue)}
.workspace-head{
  border:1px solid var(--line);border-radius:18px;background:
  linear-gradient(135deg,rgba(79,124,255,.10),transparent 32%),
  #0f131c;padding:18px;display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px
}
.workspace-product{display:flex;gap:14px;align-items:center}
.workspace-logo{width:58px;height:58px;border-radius:15px;display:grid;place-items:center;font-size:23px;font-weight:900;background:linear-gradient(135deg,#233258,#161b28);border:1px solid #31405e}
.workspace-copy h1{font-size:22px;margin:0 0 3px;letter-spacing:-.035em}
.workspace-copy p{font-size:10px;color:var(--muted);margin:0}
.workspace-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.kpi{padding:14px;background:#0f141d;border:1px solid var(--line);border-radius:14px}
.kpi b{font-size:17px;display:block}
.kpi span{font-size:9px;color:var(--muted);margin-top:4px;display:block}
.test-quality{padding:16px}
.quality-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.quality-score{font-size:24px;font-weight:900;letter-spacing:-.05em}
.quality-caption{font-size:9px;color:var(--muted)}
.quality-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.quality-box{background:#0c1017;border:1px solid #202838;border-radius:12px;padding:10px}
.quality-box .bar{height:6px;background:#1f2633;border-radius:99px;margin:8px 0 6px;overflow:hidden}
.quality-box .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--violet));border-radius:99px}
.quality-box b{font-size:11px}
.quality-box span{font-size:9px;color:var(--muted)}
.brief{width:100%;min-height:145px;background:#0c1017;color:#dfe5f1;border:1px solid #252d3e;border-radius:13px;padding:13px;resize:vertical;outline:none;line-height:1.5;font-size:11px}
.brief:focus{border-color:#4a66af}
.asset-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.asset-card{border:1px solid var(--line);background:#0e1219;border-radius:14px;overflow:hidden;position:relative}
.asset-preview{height:128px;background:linear-gradient(145deg,#222a3b,#10141c);display:grid;place-items:center;overflow:hidden}
.asset-preview img,.asset-preview video{width:100%;height:100%;object-fit:cover}
.asset-fallback{font-size:30px;font-weight:900;color:#6f7c93}
.asset-meta{padding:10px}
.asset-meta b{font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset-meta span{font-size:8px;color:var(--muted);display:block;margin-top:3px}
.asset-check{position:absolute;top:9px;right:9px;width:22px;height:22px;border-radius:99px;border:1px solid #3c465b;background:rgba(7,9,13,.82);display:grid;place-items:center;cursor:pointer;font-size:11px}
.asset-check.selected{background:var(--blue);border-color:var(--blue)}
.avatar-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.avatar-card{padding:13px}
.avatar-top{display:flex;gap:11px}
.avatar-face{width:52px;height:52px;border-radius:15px;background:linear-gradient(145deg,#37435b,#171d28);position:relative;overflow:hidden;flex:0 0 auto}
.avatar-face:before{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#73819a;left:16px;top:8px}
.avatar-face:after{content:"";position:absolute;width:34px;height:22px;border-radius:20px 20px 8px 8px;background:#55627a;left:9px;bottom:5px}
.avatar-info{min-width:0}
.avatar-info b{font-size:12px;display:block}
.avatar-info span{font-size:9px;color:var(--muted);display:block;margin-top:3px}
.avatar-meta{display:grid;gap:6px;margin-top:11px}
.meta-row{display:flex;justify-content:space-between;gap:8px;font-size:9px}
.meta-row span:first-child{color:var(--muted)}
.meta-row span:last-child{color:#ccd4e4;text-align:right}
.table-wrap{border:1px solid var(--line);border-radius:15px;overflow:auto;background:#0d1118}
table{border-collapse:collapse;width:100%;min-width:880px}
th{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#6f7b90;background:#10151e;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0}
td{font-size:10px;padding:11px 12px;border-bottom:1px solid #1c2330;color:#c7cfdd}
tr:last-child td{border-bottom:0}
tr:hover td{background:#111722}
.inline-input{background:#0a0e14;border:1px solid #273043;color:#e7edf8;border-radius:8px;padding:6px 7px;width:86px}
.switch{position:relative;width:34px;height:19px;border-radius:999px;background:#293043;cursor:pointer;display:inline-block;vertical-align:middle}
.switch:after{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:#8b96a8;top:3px;left:3px;transition:.15s}
.switch.on{background:rgba(53,208,127,.28)}
.switch.on:after{left:18px;background:#75e5aa}
.tree-shell{padding:20px;overflow:auto;min-height:520px}
.tree{display:flex;align-items:flex-start;gap:58px;min-width:1100px;padding:18px}
.tree-col{display:grid;gap:18px;position:relative}
.tree-col:not(:first-child):before{content:"";position:absolute;width:42px;height:1px;background:#303a50;left:-50px;top:34px}
.tree-node{width:210px;border:1px solid #2a3449;border-radius:14px;background:#111722;padding:12px;position:relative}
.tree-node.root{border-color:#4d65a6;background:linear-gradient(135deg,rgba(79,124,255,.12),#111722)}
.tree-node.best{border-color:rgba(53,208,127,.46);box-shadow:0 0 0 1px rgba(53,208,127,.08)}
.tree-node:before{content:"";position:absolute;left:-18px;top:33px;width:18px;height:1px;background:#303a50}
.tree-col:first-child .tree-node:before{display:none}
.node-title{font-size:11px;font-weight:800}
.node-sub{font-size:9px;color:var(--muted);margin-top:4px}
.node-metrics{display:flex;gap:8px;margin-top:9px;font-size:9px;color:#b6c0d2}
.node-tag{display:inline-flex;margin-top:8px;font-size:8px;border-radius:999px;padding:4px 6px;background:#0b0f16;border:1px solid #293245;color:#91a0b9}
.job-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

    if(state.context.productId){ const p=product(state.context.productId); if(p) out.push({type:"Producto",name:p.name,key:"productId"}); }

    if(state.context.videoId){ const v=video(state.context.videoId); if(v) out.push({type:"Vídeo",name:v.title,key:"videoId"}); }
    if(state.context.avatarId){ const a=avatarById(state.context.avatarId); if(a) out.push({type:"Avatar",name:a.name,key:"avatarId"}); }
    for(const aid of state.context.assetIds||[]){
      let found=null; for(const p of state.products){ found=(p.assets||[]).find(a=>a.id===aid); if(found) break; }
      if(found) out.push({type:"Asset",name:found.name,key:"asset",assetId:aid});
    }
    return out;
  }

  function qualityBox(label,n,target){
    const pct=Math.min(n/target*100,100);
    return `<div class="quality-box"><b>${label} · ${n}</b><div class="bar"><i style="width:${pct}%"></i></div><span>${pct>=100?"Cobertura amplia":"Aún puedes diversificar"}</span></div>`;
  }
  function testAdvice(p){
    const score=coverageScore(p);
    if(p.day>=7 && score>=80 && p.bestViews<5000 && p.sales===0) return "Test amplio y sin señal clara: candidato fuerte a descartar, pero nunca de forma automática.";
    if(p.day>=5 && score<65) return `Llevas ${p.day} días, pero el test sigue estrecho. Antes de concluir, aumenta diversidad de conceptos, avatares o ángulos.`;
    if(p.bestViews>=20000 || p.sales>=5) return "Hay señal suficiente para explotar el mejor descendiente: pilares pequeños, cambio de avatar, ángulo o concepto.";
    if(p.bestViews>=5000) return "Hay interés. Empieza variantes del ganador sin abandonar por completo la exploración.";
    return "Todavía no hay señal suficiente. Sigue publicando creativos distintos y evita juzgar únicamente por el día del test.";
  }

  function bindDynamicInputs(){

    const ci=document.getElementById("contextInstruction");
    if(ci) ci.addEventListener("input",e=>{state.context.instruction=e.target.value;save();});
    const hi=document.getElementById("homeContextInstruction");
    if(hi) hi.addEventListener("input",e=>{state.context.instruction=e.target.value;save();});
    const cs=document.getElementById("conceptSearch");
    if(cs) cs.addEventListener("input",e=>{state.ui.search=e.target.value;save();render();setTimeout(()=>document.getElementById("conceptSearch")?.focus(),0);});
    const cf=document.getElementById("conceptFilter");
    if(cf) cf.addEventListener("change",e=>{state.ui.conceptFilter=e.target.value;save();render();});
    const ags=document.getElementById("assetGlobalSearch");
    if(ags) ags.addEventListener("input",e=>{state.ui.assetSearch=e.target.value;save();render();setTimeout(()=>{const x=document.getElementById("assetGlobalSearch");if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length);}},0);});
    const tp=document.getElementById("treeProduct");
    if(tp) tp.addEventListener("change",e=>{state.ui.treeProductId=e.target.value;save();render();});
    document.querySelectorAll("[data-video-metric]").forEach(el=>el.addEventListener("change",e=>{
      const v=video(e.target.dataset.videoMetric); if(v){ v[e.target.dataset.field]=Number(e.target.value)||0; recalcProduct(v.productId); save(); toast("Métrica actualizada");}
    }));
  }

  function recalcProduct(pid){
    const p=product(pid); if(!p) return;
    const vs=state.videos.filter(v=>v.productId===pid && v.published);
    p.published=vs.length;
    p.views=vs.reduce((a,v)=>a+Number(v.views||0),0);
    p.comments=vs.reduce((a,v)=>a+Number(v.comments||0),0);
    p.sales=vs.reduce((a,v)=>a+Number(v.sales||0),0);
    p.bestViews=vs.reduce((a,v)=>Math.max(a,Number(v.views||0)),0);
    p.testedConceptIds=[...new Set([...(p.testedConceptIds||[]),...vs.map(v=>v.conceptId).filter(Boolean)])];
    p.conceptsTested=p.testedConceptIds.length;
    p.avatarsTested=new Set(vs.map(v=>v.avatarId||v.avatarName).filter(Boolean)).size;
    p.salesAngles=p.salesAngles||[];
    p.hiddenSalesAngleTitles=p.hiddenSalesAngleTitles||[];
    const angleCounts=new Map();
    vs.forEach(v=>{const title=String(v.angle||"").trim();if(title)angleCounts.set(title,(angleCounts.get(title)||0)+1)});
    angleCounts.forEach((count,title)=>{
      if(p.hiddenSalesAngleTitles.includes(title))return;
      let item=p.salesAngles.find(a=>String(a.title||"").trim().toLowerCase()===title.toLowerCase());
      if(!item){item={id:uid("ang"),title,status:"En prueba",tests:count,note:"Añadido automáticamente desde un vídeo publicado.",lastTest:""};p.salesAngles.push(item)}
      else item.tests=Math.max(Number(item.tests||0),count);
    });
    p.anglesTested=p.salesAngles.length;
  }

  function buildContextPayload(){
    const p=product(state.context.productId);
    const c=concept(state.context.conceptId);
    const v=video(state.context.videoId);
    const a=avatarById(state.context.avatarId);
    const assets=[];
    for(const aid of state.context.assetIds||[]){
      for(const prod of state.products){ const x=(prod.assets||[]).find(z=>z.id===aid); if(x){assets.push({id:x.id,name:x.name,type:x.type,productId:prod.id});break;} }
    }
    return {
      selected_at:new Date().toISOString(),
      mode:state.context.mode,
      product:p?{id:p.id,name:p.name,label:p.label,brief:p.brief}:null,
      concept:c?{id:c.id,name:c.name,category:c.category,description:c.desc,source:c.source,tags:c.tags}:null,
      video:v?{id:v.id,title:v.title,variation:v.variation,views:v.views,sales:v.sales}:null,
      avatar:a?{id:a.id,name:a.name,age:a.age,segment:a.segment,angle:a.angle,role:a.role}:null,
      assets,
      instruction:state.context.instruction,
      locks:state.context.locks,
      presets:{remix:state.settings.remixDefault,create:state.settings.createDefault,upscale:state.settings.upscale}
    };
  }

  function prepare(mode){
    state.context.mode=mode;
    save();
    const p=product(state.context.productId);
    if(!p){ toast("Selecciona primero un producto"); return; }
    showContextModal(mode);
  }
  function showContextModal(mode){
    const ctx=buildContextPayload();
    const missing=[];
    if(mode==="REMIX" && !ctx.video && !ctx.concept) missing.push("vídeo o concepto de referencia");
    if(!ctx.avatar) missing.push("avatar (opcional, pero recomendado)");
    modal(`
      <div class="modal-head"><div><h3>${mode} preparado para ChatGPT</h3><p>Esto es lo que el futuro conector entregará al chat automáticamente.</p></div><button class="close" data-close-modal>×</button></div>
      <div class="modal-body">
        ${missing.length?`<div class="review-note"><b>Falta:</b> ${missing.join(", ")}.</div>`:""}
        <div class="context-list">
          <div class="context-row"><span>Producto</span><b>${esc(ctx.product?.name||"—")}</b></div>
          <div class="context-row"><span>Concepto</span><b>${esc(ctx.concept?.name||"—")}</b></div>
          <div class="context-row"><span>Vídeo</span><b>${esc(ctx.video?.title||"—")}</b></div>
          <div class="context-row"><span>Avatar</span><b>${esc(ctx.avatar?.name||"—")}</b></div>
          <div class="context-row"><span>Assets</span><b>${ctx.assets.length}</b></div>
          <div class="context-row"><span>Modelo</span><b>${esc(mode==="REMIX"?state.settings.remixDefault:state.settings.createDefault)}</b></div>
        </div>
        <div class="review-note" style="margin-top:12px"><b>Instrucciones:</b><br>${esc(ctx.instruction||"Sin instrucciones adicionales.")}</div>
        <div class="chips">${Object.entries(ctx.locks).filter(([,v])=>v).map(([k])=>`<span class="chip blue">Lock · ${esc(k)}</span>`).join("")}</div>
      </div>
      <div class="modal-foot"><button class="btn" data-action="copy-context">Copiar JSON</button><button class="btn primary" data-close-modal>Listo</button></div>
    `);
  }

  function formModal(title,sub,body,action,attrs=""){
    return `<div class="modal-head"><div><h3>${esc(title)}</h3><p>${esc(sub)}</p></div><button class="close" data-close-modal>×</button></div><div class="modal-body">${body}</div><div class="modal-foot"><button class="btn" data-close-modal>Cancelar</button><button class="btn primary" data-action="${action}" ${attrs}>Guardar</button></div>`;
  }
  function modal(html){ document.getElementById("modalRoot").innerHTML=`<div class="modal-backdrop"><div class="modal">${html}</div></div>`; }
  function closeModal(){ const r=document.getElementById("modalRoot"); if(r) r.innerHTML=""; }
  function showTextModal(title,text){ modal(`<div class="modal-head"><div><h3>${esc(title)}</h3></div><button class="close" data-close-modal>×</button></div><div class="modal-body"><pre style="white-space:pre-wrap;font-size:10px">${esc(text)}</pre></div>`); }
  function toast(msg){
    const wrap=document.getElementById("toasts"); if(!wrap) return;
    const el=document.createElement("div");el.className="toast";el.textContent=msg;wrap.appendChild(el);setTimeout(()=>el.remove(),2800);
  }

  document.addEventListener("click", async e=>{
    const t=e.target.closest("[data-route],[data-action],[data-open-product],[data-select-product],[data-select-concept],[data-select-video],[data-select-avatar],[data-select-asset],[data-product-tab],[data-context-remove],[data-lock],[data-review-job],[data-approve-job],[data-retry-job],[data-confirm-retry],[data-feedback-chip],[data-exploit],[data-select-job-context],[data-close-modal]");
    if(!t) return;

    if(t.dataset.route){
      if(t.dataset.treeProduct) state.ui.treeProductId=t.dataset.treeProduct;
      route(t.dataset.route); return;
    }
    if(t.dataset.openProduct){ state.ui.openProductId=t.dataset.openProduct; state.ui.route="products"; state.ui.sidebarOpen=false; save(); render(); return; }
    if(t.dataset.selectProduct){ selectProduct(t.dataset.selectProduct); return; }
    if(t.dataset.selectConcept){
      state.context.conceptId=t.dataset.selectConcept; save(); toast(`${concept(t.dataset.selectConcept)?.name||"Concepto"} seleccionado`);
      if(t.hasAttribute("data-close-after")) closeModal(); else render(); return;
    }
    if(t.dataset.selectVideo){
      const v=video(t.dataset.selectVideo); if(v){state.context.videoId=v.id;state.context.productId=v.productId;state.context.conceptId=v.conceptId||state.context.conceptId;state.context.avatarId=v.avatarId||state.context.avatarId;save();toast("Vídeo añadido al contexto");render();} return;
    }
    if(t.dataset.selectAvatar){
      state.context.avatarId=t.dataset.selectAvatar; state.context.productId=t.dataset.productId||state.context.productId; save();toast("Avatar seleccionado");render();return;
    }
    if(t.dataset.selectAsset){ state.context.productId=t.dataset.productId||state.context.productId; toggleAsset(t.dataset.selectAsset); return; }
    if(t.dataset.productTab){ state.ui.productTab=t.dataset.productTab;save();render();return; }
    if(t.dataset.contextRemove){
      if(t.dataset.contextRemove==="asset"){
        state.context.assetIds=(state.context.assetIds||[]).filter(x=>x!==t.dataset.assetId);
      } else state.context[t.dataset.contextRemove]=null;
      save();render();return;
    }
    if(t.dataset.lock){ state.context.locks[t.dataset.lock]=!state.context.locks[t.dataset.lock];save();render();return; }
    if(t.dataset.reviewJob){ route("review"); setTimeout(()=>document.querySelector(`[data-retry-job="${t.dataset.reviewJob}"]`)?.scrollIntoView({behavior:"smooth",block:"center"}),50);return; }
    if(t.dataset.approveJob){
      const j=state.jobs.find(x=>x.id===t.dataset.approveJob); if(j){j.status="approved";j.progress=100;save();toast("Aprobado · preset de upscale aplicado");render();} return;
    }
    if(t.dataset.retryJob){ const j=state.jobs.find(x=>x.id===t.dataset.retryJob); if(j) retryModal(j); return; }
    if(t.dataset.feedbackChip){ t.classList.toggle("active"); return; }
    if(t.dataset.confirmRetry){
      const j=state.jobs.find(x=>x.id===t.dataset.confirmRetry); if(!j) return;
      const chips=[...document.querySelectorAll(".feedback-chip.active")].map(x=>x.textContent);
      const text=document.getElementById("retryFeedback")?.value.trim()||"";
      const feedback=[...chips,text].filter(Boolean).join(" · ");
      const nj={...clone(j),id:uid("j"),status:"queued",progress:8,version:j.version+1,feedback,note:j.note,createdAt:now()};
      state.jobs.unshift(nj); save(); closeModal(); toast(`Retry creado · V${nj.version}`); render(); return;
    }
    if(t.dataset.exploit){
      const map={pillar:"Explotar ganador con cambios mínimos de pilares visuales.",avatar:"Cambiar avatar/segmento manteniendo la estructura ganadora.",angle:"Cambiar ángulo de venta manteniendo hook y estructura.",concept:"Aplicar otro concepto conservando aprendizajes del ganador."};
      state.context.instruction=[state.context.instruction,map[t.dataset.exploit]].filter(Boolean).join(" ");
      save();toast("Instrucción añadida al contexto");render();return;
    }
    if(t.dataset.selectJobContext){
      const j=state.jobs.find(x=>x.id===t.dataset.selectJobContext); if(j){state.context.productId=j.productId;state.context.conceptId=j.conceptId;state.context.avatarId=j.avatarId;state.context.mode=j.mode.toUpperCase();state.context.instruction=j.note||"";save();toast("Contexto del job seleccionado");render();}return;
    }
    if(t.hasAttribute("data-close-modal")){ closeModal(); return; }

    const a=t.dataset.action;
    if(!a) return;
    if(a==="toggle-sidebar"){state.ui.sidebarOpen=!state.ui.sidebarOpen;save();render();}
    else if(a==="add-product") addProductModal();
    else if(a==="add-concept") addConceptModal();
    else if(a==="open-context") openContextModal();
    else if(a==="copy-context") copyContext();
    else if(a==="clear-context"){state.context={...clone(seed.context)};save();render();toast("Contexto limpiado");}
    else if(a==="prepare-chatgpt") prepare(state.context.mode||"REMIX");
    else if(a==="prepare-remix") prepare("REMIX");
    else if(a==="prepare-create") prepare("CREATE");
    else if(a==="concept-detail"){const c=concept(t.dataset.id);if(c)conceptDetailModal(c);}
    else if(a==="edit-product"){const p=product(t.dataset.id);if(p)editProductModal(p);}
    else if(a==="add-avatar") addAvatarModal(t.dataset.productId);
    else if(a==="assets-pick-product"){state.ui.assetsProductId=t.dataset.productId;state.ui.assetSearch="";state.context.productId=t.dataset.productId;save();render();}
    else if(a==="assets-pick-category"){state.ui.assetsCategory=t.dataset.category;state.ui.assetSearch="";save();render();}
    else if(a==="delete-avatar"){
      const p=product(t.dataset.productId);if(!p)return;
      const av=(p.avatars||[]).find(x=>x.id===t.dataset.avatarId);if(!av)return;
      if(!confirm(`¿Eliminar el avatar “${av.name}”? Los vídeos publicados conservarán su nombre como histórico.`))return;
      state.videos.filter(v=>v.productId===p.id && v.avatarId===av.id).forEach(v=>{v.avatarName=v.avatarName||av.name;v.avatarId=null;});
      state.jobs.filter(j=>j.productId===p.id && j.avatarId===av.id).forEach(j=>{j.avatarName=j.avatarName||av.name;j.avatarId=null;});
      p.avatars=(p.avatars||[]).filter(x=>x.id!==av.id);
      if(state.context.avatarId===av.id)state.context.avatarId=null;
      recalcProduct(p.id);save();render();toast("Avatar eliminado; historial conservado");
    }
    else if(a==="delete-asset"){
      const p=product(t.dataset.productId);if(!p)return;
      const asset=(p.assets||[]).find(x=>x.id===t.dataset.assetId);if(!asset)return;
      if(!confirm(`¿Eliminar el asset “${asset.name}”?`))return;
      p.assets=(p.assets||[]).filter(x=>x.id!==asset.id);
      state.context.assetIds=(state.context.assetIds||[]).filter(id=>id!==asset.id);
      save();render();toast("Asset eliminado");
    }
    else if(a==="add-sales-angle") salesAngleModal(t.dataset.productId);
    else if(a==="edit-sales-angle") salesAngleModal(t.dataset.productId,t.dataset.angleId);
    else if(a==="save-sales-angle"){
      const p=product(t.dataset.productId);if(!p)return;
      p.salesAngles=p.salesAngles||[];p.hiddenSalesAngleTitles=p.hiddenSalesAngleTitles||[];
      const title=document.getElementById("f-angle-title")?.value.trim();if(!title){toast("Escribe el ángulo de venta");return;}
      const id=t.dataset.angleId;const existing=p.salesAngles.find(x=>x.id===id);const oldTitle=existing?.title||"";
      const data={title,status:document.getElementById("f-angle-status").value,tests:Number(document.getElementById("f-angle-tests").value)||0,lastTest:document.getElementById("f-angle-date").value,note:document.getElementById("f-angle-note").value.trim()};
      if(existing)Object.assign(existing,data);else p.salesAngles.push({id:uid("ang"),...data});
      if(oldTitle&&oldTitle!==title)state.videos.filter(v=>v.productId===p.id&&String(v.angle||"").trim()===oldTitle).forEach(v=>v.angle=title);
      p.hiddenSalesAngleTitles=p.hiddenSalesAngleTitles.filter(x=>x.toLowerCase()!==title.toLowerCase());
      recalcProduct(p.id);save();closeModal();render();toast("Ángulo guardado");
    }
    else if(a==="delete-sales-angle"){
      const p=product(t.dataset.productId);if(!p)return;const item=(p.salesAngles||[]).find(x=>x.id===t.dataset.angleId);if(!item)return;
      if(!confirm(`¿Eliminar el ángulo “${item.title}” de este producto?`))return;
      p.salesAngles=(p.salesAngles||[]).filter(x=>x.id!==item.id);p.hiddenSalesAngleTitles=[...new Set([...(p.hiddenSalesAngleTitles||[]),item.title])];
      p.anglesTested=p.salesAngles.length;save();render();toast("Ángulo eliminado");
    }
    else if(a==="use-sales-angle"){
      const angle=t.dataset.angle||"";state.context.productId=state.ui.openProductId||state.context.productId;
      const line=`Ángulo de venta: ${angle}.`;if(!String(state.context.instruction||"").includes(line))state.context.instruction=[state.context.instruction,line].filter(Boolean).join(" ");
      save();render();toast("Ángulo añadido al contexto de ChatGPT");
    }
    else if(a==="add-tested-concept") testedConceptModal(t.dataset.productId);
    else if(a==="save-tested-concept"){
      const p=product(t.dataset.productId);if(!p)return;p.testedConceptIds=p.testedConceptIds||[];
      let cid=document.getElementById("f-tested-concept")?.value||"";
      const newName=document.getElementById("f-new-concept-name")?.value.trim()||"";
      if(newName){const c={id:uid("c"),name:newName,category:document.getElementById("f-new-concept-category").value,desc:document.getElementById("f-new-concept-desc").value.trim(),source:document.getElementById("f-new-concept-source").value.trim()||"Manual",uses:0,bestViews:0,avgViews:0,tags:(document.getElementById("f-new-concept-tags").value||"").split(",").map(x=>x.trim()).filter(Boolean),signal:"En prueba",videoRefs:[]};state.concepts.unshift(c);cid=c.id;}
      if(!cid){toast("Selecciona un concepto o crea uno nuevo");return;}
      if(!p.testedConceptIds.includes(cid))p.testedConceptIds.push(cid);p.conceptsTested=p.testedConceptIds.length;
      save();closeModal();render();toast("Concepto añadido al test");
    }
    else if(a==="unlink-tested-concept"){
      const p=product(t.dataset.productId);if(!p)return;const cid=t.dataset.conceptId;
      const used=state.videos.some(v=>v.productId===p.id&&v.published&&v.conceptId===cid);
      if(used){toast("Ese concepto está ligado a un vídeo publicado y se conserva como histórico");return;}
      p.testedConceptIds=(p.testedConceptIds||[]).filter(id=>id!==cid);p.conceptsTested=p.testedConceptIds.length;save();render();toast("Concepto quitado del test");
    }
    else if(a==="upload-asset") uploadAssetModal(t.dataset.productId);
    else if(a==="add-published") addPublishedModal(t.dataset.productId);
    else if(a==="mark-published"){const j=state.jobs.find(x=>x.id===t.dataset.jobId);if(j)addPublishedModal(j.productId,j.id);}
    else if(a==="create-product"){
      const name=document.getElementById("f-name")?.value.trim(), label=document.getElementById("f-label")?.value.trim();
      if(!name||!label){toast("Nombre y producto son obligatorios");return;}
      const p={id:uid("p"),name,label,status:document.getElementById("f-status").value,day:Number(document.getElementById("f-day").value)||1,testMax:7,published:0,conceptsTested:0,avatarsTested:0,anglesTested:0,views:0,comments:0,sales:0,bestViews:0,accent:"paw",brief:document.getElementById("f-brief").value,assets:[],avatars:[],testedConceptIds:[],salesAngles:[],hiddenSalesAngleTitles:[]};
      state.products.push(p);save();closeModal();state.ui.openProductId=p.id;render();toast("Producto creado");
    }
    else if(a==="create-concept"){
      const name=document.getElementById("f-name")?.value.trim(); if(!name){toast("Pon un nombre");return;}
      const c={id:uid("c"),name,category:document.getElementById("f-category").value,desc:document.getElementById("f-desc").value,source:document.getElementById("f-source").value||"Manual",uses:0,bestViews:0,avgViews:0,tags:(document.getElementById("f-tags").value||"").split(",").map(x=>x.trim()).filter(Boolean)};
      state.concepts.unshift(c);save();closeModal();render();toast("Concepto guardado");
    }
    else if(a==="save-product-metrics"){
      const p=product(t.dataset.productId); if(!p)return;
      p.status=document.getElementById("f-status").value;p.day=Number(document.getElementById("f-day").value)||0;p.published=Number(document.getElementById("f-published").value)||0;
      p.conceptsTested=Number(document.getElementById("f-concepts").value)||0;p.avatarsTested=Number(document.getElementById("f-avatars").value)||0;p.anglesTested=Number(document.getElementById("f-angles").value)||0;
      p.views=Number(document.getElementById("f-views").value)||0;p.comments=Number(document.getElementById("f-comments").value)||0;p.sales=Number(document.getElementById("f-sales").value)||0;p.bestViews=Number(document.getElementById("f-best").value)||0;
      save();closeModal();render();toast("Métricas guardadas");
    }
    else if(a==="create-avatar"){
      const p=product(t.dataset.productId);if(!p)return;
      const av={id:uid("av"),name:document.getElementById("f-name").value||"Nuevo avatar",age:document.getElementById("f-age").value||"—",segment:document.getElementById("f-segment").value||"Sin segmento",angle:document.getElementById("f-angle").value||"—",role:document.getElementById("f-role").value||"—"};
      p.avatars.push(av);save();closeModal();render();toast("Avatar añadido");
    }
    else if(a==="create-asset"){
      const p=product(t.dataset.productId);if(!p)return;
      const f=document.getElementById("f-file")?.files?.[0];
      const finish=(src)=>{
        p.assets.push({id:uid("as"),name:document.getElementById("f-name").value||f?.name||"Asset",type:document.getElementById("f-type").value,src:src||null});
        try{save();}catch(e){toast("El archivo es demasiado pesado para localStorage; se guardó sin preview.");p.assets[p.assets.length-1].src=null;save();}
        closeModal();render();toast("Asset añadido");
      };
      if(f){ const reader=new FileReader();reader.onload=()=>finish(reader.result);reader.readAsDataURL(f);} else finish(null);
    }
    else if(a==="create-published"){
      const pid=t.dataset.productId;
      const selectedAvatarId=document.getElementById("f-avatar").value||null;
      const selectedAvatar=(product(pid)?.avatars||[]).find(a=>a.id===selectedAvatarId);
      const v={id:uid("v"),productId:pid,title:document.getElementById("f-title").value||"Creativo publicado",conceptId:document.getElementById("f-concept").value||null,avatarId:selectedAvatarId,avatarName:selectedAvatar?.name||"",angle:document.getElementById("f-angle").value||"",published:true,views:Number(document.getElementById("f-views").value)||0,comments:Number(document.getElementById("f-comments").value)||0,sales:Number(document.getElementById("f-sales").value)||0,parentId:document.getElementById("f-parent").value||null,variation:document.getElementById("f-variation").value||"Original",createdAt:now()};
      state.videos.unshift(v); if(t.dataset.jobId){const j=state.jobs.find(x=>x.id===t.dataset.jobId);if(j)j.publishedVideoId=v.id;}
      recalcProduct(pid);save();closeModal();render();toast("Creativo registrado como publicado");
    }
    else if(a==="save-settings"){
      state.settings.remixDefault=document.getElementById("set-remix").value;state.settings.createDefault=document.getElementById("set-create").value;state.settings.upscale=document.getElementById("set-upscale").value;save();toast("Ajustes guardados");
    }
    else if(a==="export-data"){
      const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const aa=document.createElement("a");aa.href=url;aa.download="creativeos-data.json";aa.click();URL.revokeObjectURL(url);
    }
    else if(a==="reset-data"){ if(confirm("¿Restaurar la demo? Se borrarán tus cambios locales.")){state=clone(seed);save();render();toast("Demo restaurada");} }
  });

  render();
})();

</script>
  <div id="conceptEditor"><div class="ce-modal"><div id="ceContent"></div></div></div>
  <script src="./creativeos-enhancements.js?v=3"></script>
  <script src="./creativeos-ux-v4.js?v=1"></script>
  <script src="./creativeos-intelligence-core-v2.js?v=2"></script>
  <script src="./creativeos-intelligence-crud.js?v=2"></script>
</body>
</html>
