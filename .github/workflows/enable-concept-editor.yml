name: Enable editable concepts

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enable_concept_editor.py'
      - '.github/workflows/enable-concept-editor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index
        run: python3 scripts/enable_concept_editor.py
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Enable concept editing and video references"
          git push
