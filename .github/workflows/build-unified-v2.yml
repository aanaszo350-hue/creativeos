name: Build unified CreativeOS v4

on:
  push:
    branches: [main]
    paths:
      - 'base.html'
      - 'creativeos-cloud.js'
      - 'creativeos-enhancements.css'
      - 'creativeos-enhancements.js'
      - 'creativeos-ux-v4.css'
      - 'creativeos-ux-v4.js'
      - 'creativeos-intelligence.css'
      - 'creativeos-intelligence-v3.css'
      - 'creativeos-product-lens.css'
      - 'creativeos-intelligence-core-v3.js'
      - 'creativeos-product-lens.js'
      - 'creativeos-intelligence-crud.css'
      - 'creativeos-intelligence-crud.js'
      - 'creativeos-bridge-schema.json'
      - 'scripts/apply_assets_patch.py'
      - 'scripts/enhance_testing_workspace.py'
      - 'scripts/build_unified_v2.py'
      - 'scripts/smoke_intelligence_v3b.mjs'
      - '.github/workflows/build-unified-v2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate Intelligence JavaScript
        run: |
          node --check creativeos-intelligence-core-v3.js
          node --check creativeos-product-lens.js
          node --check creativeos-intelligence-crud.js
          node --check scripts/smoke_intelligence_v3b.mjs

      - name: Confirm product-centric Intelligence layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/build_unified_v2.py').read_text(encoding='utf-8')
          lens=Path('creativeos-product-lens.js').read_text(encoding='utf-8')
          checks={
            'v3 core':'creativeos-intelligence-core-v3.js?v=1' in s,
            'product lens':'creativeos-product-lens.js?v=1' in s,
            'product lens css':'creativeos-product-lens.css?v=1' in s,
            'matrix replacement':'Matriz de Tests' in lens,
            'product angles':'data-cio-angle-product' in lens,
            'grouped learnings':'data-cio-learning-mode' in lens,
            'niche concept editing':"editActions('concept'" in lens,
            'niche angle editing':"editActions('angle'" in lens,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('Product lens validation failed: '+', '.join(failed))
          PY

      - name: Build production index
        run: python3 scripts/build_unified_v2.py

      - name: Validate production index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          core=Path('creativeos-intelligence-core-v3.js').read_text(encoding='utf-8')
          crud=Path('creativeos-intelligence-crud.js').read_text(encoding='utf-8')
          checks={
            'no iframe wrapper':'id="appframe"' not in s,
            'assets workspace':'Assets workspace — product → category → file' in s,
            'unified enhancements':'creativeos-enhancements.js?v=3' in s,
            'workflow center':'creativeos-ux-v4.js?v=1' in s,
            'cloud media bridge':'creativeos-cloud.js?v=2' in s,
            'workflow intelligence core':'creativeos-intelligence-core-v3.js?v=1' in s,
            'product intelligence lens':'creativeos-product-lens.js?v=1' in s,
            'product lens styles':'creativeos-product-lens.css?v=1' in s,
            'old v2 disabled':'creativeos-intelligence-core-v2.js?v=2' not in s,
            'old v1 disabled':'<script src="./creativeos-intelligence.js?v=1"></script>' not in s,
            'visual hierarchy styles':'creativeos-intelligence-v3.css?v=1' in s,
            'intelligence crud':'creativeos-intelligence-crud.js?v=2' in s,
            'intelligence crud styles':'creativeos-intelligence-crud.css?v=2' in s,
            'safe shell observer':"if(!document.getElementById('ciNavGroup')||!document.getElementById('ciHost'))ensureShell()" in core,
            'workflow builder':'data-ci-add-node' in core and 'data-ci-save-workflow' in core,
            'daily batch logger':'data-ci-save-log' in core,
            'crud modal backdrop safe':'<div class="cix-backdrop" data-cix-close>' not in crud and '<div class="cix-backdrop">' in crud,
            'crud add controls':'data-cix-add' in crud,
            'crud edit controls':'data-cix-edit' in crud,
            'crud delete controls':'data-cix-delete' in crud,
            'concept editor shell':'id="conceptEditor"' in s,
            'bridge schema':Path('creativeos-bridge-schema.json').exists(),
            'native sales angles editable':'data-action="add-sales-angle"' in s and 'data-action="edit-sales-angle"' in s,
            'native tested concepts editable':'data-action="add-tested-concept"' in s,
            'native delete asset':'data-action="delete-asset"' in s,
            'native delete avatar':'data-action="delete-avatar"' in s,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('Validation failed: '+', '.join(failed))
          print('Validation OK')
          PY

      - name: Browser smoke test workflow intelligence
        run: node scripts/smoke_intelligence_v3b.mjs

      - name: Commit production build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No production changes"
            exit 0
          fi
          git commit -m "Build CreativeOS product-centric intelligence"
          git push
