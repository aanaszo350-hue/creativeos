name: Build unified CreativeOS v6

on:
  push:
    branches: [main]
    paths:
      - 'base.html'
      - 'creativeos-cloud.js'
      - 'creativeos-media-upload.js'
      - 'creativeos-product-set-migration.js'
      - 'creativeos-enhancements.css'
      - 'creativeos-enhancements.js'
      - 'creativeos-ux-v4.css'
      - 'creativeos-ux-v4.js'
      - 'creativeos-intelligence.css'
      - 'creativeos-intelligence-v3.css'
      - 'creativeos-product-lens.css'
      - 'creativeos-matrix-v2.css'
      - 'creativeos-winner-splits.css'
      - 'creativeos-intelligence-core-v3.js'
      - 'creativeos-product-lens.js'
      - 'creativeos-matrix-v2.js'
      - 'creativeos-winner-splits.js'
      - 'creativeos-winner-splits-fixes.js'
      - 'creativeos-intelligence-crud.css'
      - 'creativeos-intelligence-crud.js'
      - 'creativeos-bridge-schema.json'
      - 'scripts/apply_assets_patch.py'
      - 'scripts/enhance_testing_workspace.py'
      - 'scripts/build_unified_v2.py'
      - 'scripts/smoke_intelligence_v3b.mjs'
      - 'scripts/smoke_winner_lab.mjs'
      - '.github/workflows/build-unified-v2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate JavaScript
        run: |
          node --check creativeos-product-set-migration.js
          node --check creativeos-intelligence-core-v3.js
          node --check creativeos-product-lens.js
          node --check creativeos-media-upload.js
          node --check creativeos-winner-splits.js
          node --check creativeos-winner-splits-fixes.js
          node --check creativeos-matrix-v2.js
          node --check creativeos-intelligence-crud.js
          node --check scripts/smoke_intelligence_v3b.mjs
          node --check scripts/smoke_winner_lab.mjs

      - name: Confirm winner-lab layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/build_unified_v2.py').read_text(encoding='utf-8')
          winner=Path('creativeos-winner-splits.js').read_text(encoding='utf-8')
          matrix=Path('creativeos-matrix-v2.js').read_text(encoding='utf-8')
          checks={
            'core':'creativeos-intelligence-core-v3.js?v=1' in s,
            'winner lab':'creativeos-winner-splits.js?v=2' in s,
            'winner fixes':'creativeos-winner-splits-fixes.js?v=1' in s,
            'winner css':'creativeos-winner-splits.css?v=1' in s,
            'matrix v2':'creativeos-matrix-v2.js?v=2' in s,
            'matrix css':'creativeos-matrix-v2.css?v=1' in s,
            'media uploader':'creativeos-media-upload.js?v=1' in s,
            'six split variables':all(x in winner for x in ["['concept'","['text_hook'","['sales_angle'","['background'","['audio'","['avatar'"]),
            'custom attempt editors':'variableFields' in winner and 'contentFromForm' in winner,
            'winner tree':'Árbol de winners' in winner and 'Cronología' in winner,
            'matrix navigation':'data-cimx-open-testing' in matrix and 'data-cimx-edit-workflow' in matrix,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('Winner lab validation failed: '+', '.join(failed))
          PY

      - name: Build production index
        run: python3 scripts/build_unified_v2.py

      - name: Validate production index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          core=Path('creativeos-intelligence-core-v3.js').read_text(encoding='utf-8')
          crud=Path('creativeos-intelligence-crud.js').read_text(encoding='utf-8')
          checks={
            'no iframe wrapper':'id="appframe"' not in s,
            'assets workspace':'Assets workspace — product → category → file' in s,
            'unified enhancements':'creativeos-enhancements.js?v=3' in s,
            'workflow center':'creativeos-ux-v4.js?v=1' in s,
            'product migration':'creativeos-product-set-migration.js?v=1' in s,
            'cloud bridge':'creativeos-cloud.js?v=2' in s,
            'media uploader':'creativeos-media-upload.js?v=1' in s,
            'workflow core':'creativeos-intelligence-core-v3.js?v=1' in s,
            'product lens':'creativeos-product-lens.js?v=1' in s,
            'interactive matrix':'creativeos-matrix-v2.js?v=2' in s,
            'winner split lab':'creativeos-winner-splits.js?v=2' in s,
            'winner edit fix':'creativeos-winner-splits-fixes.js?v=1' in s,
            'old split removed':'<script src="./creativeos-split-tests.js?v=1"></script>' not in s,
            'old continuation removed':'<script src="./creativeos-split-tests-continuation.js?v=1"></script>' not in s,
            'safe shell observer':"if(!document.getElementById('ciNavGroup')||!document.getElementById('ciHost'))ensureShell()" in core,
            'crud modal safe':'<div class="cix-backdrop" data-cix-close>' not in crud and '<div class="cix-backdrop">' in crud,
            'concept editor shell':'id="conceptEditor"' in s,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('Validation failed: '+', '.join(failed))
          print('Validation OK')
          PY

      - name: Browser smoke test intelligence
        run: node scripts/smoke_intelligence_v3b.mjs

      - name: Browser smoke test winner lab
        run: node scripts/smoke_winner_lab.mjs

      - name: Commit production build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No production changes"
            exit 0
          fi
          git commit -m "Build CreativeOS winner lab"
          git push
