name: Build unified CreativeOS v3

on:
  push:
    branches: [main]
    paths:
      - 'base.html'
      - 'creativeos-cloud.js'
      - 'creativeos-enhancements.css'
      - 'creativeos-enhancements.js'
      - 'creativeos-ux-v4.css'
      - 'creativeos-ux-v4.js'
      - 'creativeos-intelligence.css'
      - 'creativeos-intelligence-core-v2.js'
      - 'creativeos-intelligence-crud.css'
      - 'creativeos-intelligence-crud.js'
      - 'creativeos-bridge-schema.json'
      - 'scripts/apply_assets_patch.py'
      - 'scripts/enhance_testing_workspace.py'
      - 'scripts/build_unified_v2.py'
      - '.github/workflows/build-unified-v2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate Intelligence JavaScript
        run: |
          node --check creativeos-intelligence-core-v2.js
          node --check creativeos-intelligence-crud.js
      - name: Reject old looping Intelligence renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/build_unified_v2.py').read_text(encoding='utf-8')
          if 'creativeos-intelligence.js?v=1' in s:
              raise SystemExit('Old looping Intelligence renderer is still referenced')
          if 'creativeos-intelligence-core-v2.js?v=2' not in s:
              raise SystemExit('Stable Intelligence core missing')
          PY
      - name: Build production index
        run: python3 scripts/build_unified_v2.py
      - name: Validate production index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'no iframe wrapper':'id="appframe"' not in s,
            'assets workspace':'Assets workspace — product → category → file' in s,
            'unified enhancements':'creativeos-enhancements.js?v=3' in s,
            'workflow center':'creativeos-ux-v4.js?v=1' in s,
            'workflow styles':'creativeos-ux-v4.css?v=1' in s,
            'cloud media bridge':'creativeos-cloud.js?v=2' in s,
            'stable intelligence core':'creativeos-intelligence-core-v2.js?v=2' in s,
            'old intelligence disabled':'creativeos-intelligence.js?v=1' not in s,
            'intelligence styles':'creativeos-intelligence.css?v=2' in s,
            'intelligence crud':'creativeos-intelligence-crud.js?v=2' in s,
            'intelligence crud styles':'creativeos-intelligence-crud.css?v=2' in s,
            'concept editor shell':'id="conceptEditor"' in s,
            'bridge schema':Path('creativeos-bridge-schema.json').exists(),
            'sales angles tab':'Ángulos de venta probados' in s,
            'delete asset':'data-action="delete-asset"' in s,
            'delete avatar':'data-action="delete-avatar"' in s,
            'published-only concepts':'v.productId===p.id && v.published' in s,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('Validation failed: '+', '.join(failed))
          print('Validation OK')
          PY
      - name: Commit production build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No production changes"
            exit 0
          fi
          git commit -m "Build CreativeOS stable interactive intelligence"
          git push
